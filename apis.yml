aid: romtech
name: ROMTech
description: 'ROMTech (ROM Technologies, Inc.) is a privately held medical technology
  company headquartered in Brookfield, Connecticut that builds connected orthopedic
  rehabilitation technology. Its flagship product, the PortableConnect Adaptive Telemed
  Technology, is a prescription, clinician-delivered home rehabilitation device for
  patients recovering from total knee replacement, total hip replacement, joint manipulation
  and ACL repair. Adaptive pedal technology adjusts automatically to a patient''s current
  range of motion across four therapy modes (passive, active-assisted, active and resistance);
  the AccuAngle Bluetooth wearable measures knee flexion and extension during each
  session; and the PortableConnect App runs a prescribed protocol of three to five
  daily sessions over a typical four-to-eight-week plan. Session data — range of motion,
  adherence and key health metrics — streams to a Clinician Portal where the prescribing
  surgeon reviews real-time reports and adjusts the protocol remotely, with in-app
  telemedicine for face-to-face follow-ups. The technology began as the ROM3 Rehab
  device. ROMTech was named to Fast Company''s Most Innovative Companies list for 2025
  and to the LexisNexis Top 100 Global Innovators for 2026, and sells to clinicians,
  health systems and the Department of Veterans Affairs. ROMTech runs no public developer
  program: it publishes no OpenAPI, SDK, webhook catalog or developer documentation,
  and the Clinician Portal at portal.romtech.com is a closed single-page application
  backed by a private, undocumented API at middleware.romtech.com/api.'
